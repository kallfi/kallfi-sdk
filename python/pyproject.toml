[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "kallfi"
version = "0.1.1"
description = "Server-side Python SDK for the Kallfi API."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Kallfi" }]
keywords = ["kallfi", "sdk", "api"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1", "pydantic>=2.9,<3"]

[project.urls]
Homepage = "https://github.com/kallfi/kallfi-sdk"
Repository = "https://github.com/kallfi/kallfi-sdk.git"
Issues = "https://github.com/kallfi/kallfi-sdk/issues"

[project.optional-dependencies]
test = [
  "build==1.2.2.post1",
  "datamodel-code-generator==0.33.0",
  "mypy>=1.14,<2",
  "pytest==8.3.5",
  "ruff>=0.9,<1",
]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["kallfi"]

[[tool.mypy.overrides]]
module = "kallfi.models"
ignore_errors = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"src/kallfi/models.py" = ["E501"]

[tool.hatch.build.targets.wheel]
packages = ["src/kallfi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
