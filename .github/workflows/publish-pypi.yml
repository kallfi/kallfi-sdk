name: Publish Python SDK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-pypi-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    if: vars.PYPI_TRUSTED_PUBLISHING_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test "$(git describe --tags --exact-match)" = "$RELEASE_TAG"
          GITHUB_REF_TYPE=tag GITHUB_REF_NAME="$RELEASE_TAG" node scripts/check-release-version.mjs
      - run: uv sync --directory python --locked --all-extras
      - run: uv run --directory python sh scripts/check-models.sh
      - run: uv run --directory python ruff check src tests
      - run: uv run --directory python mypy src
      - run: uv run --directory python pytest
      - run: uv build --directory python
      - name: Publish with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
